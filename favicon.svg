<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#7a0d1e"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#e3c98a"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#c9a24a" stroke-width="2"/>
  <!-- Cross -->
  <rect x="27" y="10" width="10" height="44" rx="2" fill="url(#cross)"/>
  <rect x="14" y="20" width="36" height="10" rx="2" fill="url(#cross)"/>
</svg>